<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ViharaTech RAG Assistant</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1d2671, #c33764);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 600px;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            margin-bottom: 15px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #00c6ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0072ff;
        }

        .response-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            min-height: 50px;
        }

        .question {
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffd700;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 RAG Assistant</h1>

    <form method="POST">
        <input type="text" name="question" placeholder="Ask something about Python..." required>
        <button type="submit">Ask AI</button>
    </form>

    {% if question %}
    <div class="response-box">
        <div class="question">Q: {{ question }}</div>
        <div>💡 {{ response }}</div>
    </div>
    {% endif %}
</div>

</body>
</html>
